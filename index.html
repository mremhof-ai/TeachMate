<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D-Modelle für den Unterricht</title>
<style>
:root{--bg:#14110f;--panel:#1c1814;--line:#2e2822;--bone:#efe6d2;--mute:#a99f8d;--amber:#d9a441}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--bone);font:18px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 40px}
h1{font:600 30px/1.2 ui-serif,Georgia,serif;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 24px}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:active{border-color:var(--amber)}
a.card b{display:block;font:600 21px/1.3 ui-serif,Georgia,serif}
a.card span{color:var(--mute);font-size:16px}
.solo{margin:0 0 20px}
section.box{border:1px solid var(--line);border-radius:18px;background:#191511;padding:16px 16px 4px;margin:0 0 20px}
section.box h2{font:600 22px/1.2 ui-serif,Georgia,serif;margin:0 0 14px;color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:12px}
</style>
</head>
<body>
<main>
  <h1>3D-Modelle für den Unterricht</h1>
  <p class="sub">Modell antippen, drehen und zoomen.</p>

  <a class="card solo" href="rinderschaedel/"><b>Rinderschädel</b><span>Hausrind, Naturkundemuseum Kishiwada</span></a>

  <section class="box" aria-labelledby="huftiere">
    <h2 id="huftiere">Huftiere</h2>
    <div class="grid">
      <a class="card" href="schaf/"><b>Schaf</b><span>Hinterfuß, Skelett</span></a>
      <a class="card" href="reh/"><b>Reh</b><span>Vorderfuß, Skelett</span></a>
      <a class="card" href="flusspferd/"><b>Flusspferd</b><span>Vorderfuß, Skelett</span></a>
      <a class="card" href="dromedar/"><b>Dromedar</b><span>Ganzes Skelett</span></a>
      <a class="card" href="nashorn/"><b>Nashorn</b><span>Wollnashorn, Vorderfuß (Fossil)</span></a>
    </div>
  </section>
</main>
</body>
</html>
